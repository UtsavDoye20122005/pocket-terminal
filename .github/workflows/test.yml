name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci --no-fund --no-audit
        working-directory: agent
      - run: npm test
        working-directory: agent

  end-to-end:
    name: End-to-end (phone app in a real browser)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-fund --no-audit
        working-directory: agent
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - name: Full run with a sleeping computer
        run: |
          python test/e2e_direct.py | tee out.txt
          grep -q "leaked? False" out.txt
          ! grep -E "^[0-9]+ " out.txt | grep -v "leaked?" | grep -qE ": (False|None)( |$)"
      - name: Pairing security
        run: python test/e2e_pairing.py | tee out.txt && grep -q "ALL OK" out.txt
      - name: Pairing from the iPhone home-screen app
        run: python test/e2e_scan.py | tee out.txt && grep -q "ALL OK" out.txt
      - name: Phone feel (keys, paste, swipe, sessions)
        run: python test/e2e_mobile.py | tee out.txt && grep -q "ALL OK" out.txt
      - name: Ask (AI helper)
        run: python test/e2e_ask.py | tee out.txt && grep -q "ALL OK" out.txt
      - name: Auto-reconnect after the computer sleeps
        run: python test/e2e_autoconnect.py | tee out.txt && grep -q "ALL OK" out.txt
