<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1117">
<title>Pocket Terminal</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.png">
<style>
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:#0d1117; color:#e6edf3;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  form { width:100%; max-width:340px; display:flex; flex-direction:column; gap:12px; }
  h1 { margin:0 0 4px; font-size:22px; display:flex; align-items:center; gap:10px; }
  h1 img { width:32px; height:32px; }
  p { margin:0; color:#7d8590; font-size:14px; }
  input { font-size:17px; padding:12px; border-radius:8px; border:1px solid #30363d; background:#161b22; color:#e6edf3; }
  input:focus { outline:2px solid #2f81f7; border-color:transparent; }
  button { font-size:17px; padding:12px; border:0; border-radius:8px; background:#2f81f7; color:#fff; font-weight:600; }
  .err { color:#f85149; min-height:1.2em; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1><img src="/icon.svg" alt="">Pocket Terminal</h1>
  <p>Your Mac's terminal, from anywhere.</p>
  <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
  <button>Unlock</button>
  <p class="err" id="err"></p>
</form>
<script>
  const e = new URLSearchParams(location.search).get('e');
  document.getElementById('err').textContent =
    e === 'wrong' ? 'Wrong password.' : e === 'locked' ? 'Too many wrong tries. Locked for 15 minutes.' : '';
</script>
</body>
</html>
